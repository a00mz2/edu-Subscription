# ==========================================================
# nginx.conf — SubscriptionSystem Frontend
# لوحة تحكم المورّد (Subscription Admin Panel)
# ==========================================================
# الاستخدام:
#   1. ابنِ: npm run build
#   2. انسخ dist/ إلى /var/www/subscription-frontend/
#   3. انسخ هذا الملف إلى /etc/nginx/sites-available/subscription-frontend
#   4. sudo ln -s /etc/nginx/sites-available/subscription-frontend /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name subscription.edu-pro.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name subscription.edu-pro.example.com;

    ssl_certificate     /etc/letsencrypt/live/subscription.edu-pro.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subscription.edu-pro.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/subscription-frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
